services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: streamchat
      POSTGRES_PASSWORD: password
      POSTGRES_DB: streamchat
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U streamchat -d streamchat"], interval: 5s, timeout: 5s, retries: 10 }
  migrate:
    build:
      context: ./backend
      target: migrate
    command: ["-dir", "/migrations", "postgres", "postgres://streamchat:password@postgres:5432/streamchat?sslmode=disable", "up"]
    volumes: ["./backend/migrations:/migrations:ro"]
    depends_on: { postgres: { condition: service_healthy } }
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
  api:
    build:
      context: ./backend
      target: api
    environment:
      APP_ENV: development
      API_PORT: 8080
      DATABASE_URL: postgres://streamchat:password@postgres:5432/streamchat?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: replace-with-at-least-32-random-characters
      COOKIE_SECURE: "false"
      FRONTEND_ORIGIN: http://localhost:5173
      LOCAL_STORAGE_ROOT: /app/data
    volumes: ["media_data:/app/data"]
    ports: ["8080:8080"]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
  worker:
    build:
      context: ./backend
      target: worker
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://streamchat:password@postgres:5432/streamchat?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: replace-with-at-least-32-random-characters
      MEDIA_EGRESS_PROXY: ${MEDIA_EGRESS_PROXY:-}
      LOCAL_STORAGE_ROOT: /app/data
      MEDIA_TEMP_DIR: /tmp/streamchat-media
      MEDIA_MAX_SIZE_MB: 200
      MEDIA_MAX_DURATION_SECONDS: 600
      MEDIA_MAX_HEIGHT: 720
      MEDIA_DOWNLOAD_TIMEOUT_SECONDS: 300
      MEDIA_WORKER_CONCURRENCY: 2
      YTDLP_BINARY: yt-dlp
      FFMPEG_BINARY: ffmpeg
      FFPROBE_BINARY: ffprobe
    user: "10001:10001"
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 128
    volumes:
      - "media_data:/app/data"
      - "media_tmp:/tmp/streamchat-media"
    read_only: true
    tmpfs:
      - /run:size=16m,noexec,nosuid
      - /tmp:size=16m,noexec,nosuid,mode=1777
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - "./frontend:/app"
      - "frontend_node_modules:/app/node_modules"
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  postgres_data:
  media_data:
  media_tmp:
  frontend_node_modules:
